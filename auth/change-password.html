<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set a new VMC account password.">
  <title>Change Password — VMC Xtreme</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body class="portal-page">
  <header class="portal-header">
    <a class="portal-brand" href="../">VMC XTREME</a>
  </header>
  <main class="auth-page">
    <section class="auth-panel">
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1>Set your password.</h1>
      <p class="auth-intro">Your temporary password must be replaced before you can enter your VMC portal.</p>
      <form id="password-form" class="auth-form">
        <label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Confirm new password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="button button-primary" type="submit">Save new password</button>
        <p class="form-message" data-message role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
